<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alibi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Yellowtail&display=swap">
<style>
/* Concept : boîte de jeu d'enquête. Aplats pastel, polaroïds des suspects, plan vu de dessus, grille sur papier déchiré.
   Mobile : une colonne (affaire, suspects, plan, chronologie, constats). Large : chronologie à gauche, plan et constats à droite. */
:root {
  --bg: #d9ebfb;
  --panel: #ffffff;
  --panel-2: #eceffd;
  --cell: #f3f5ff;
  --ink: #2b2f55;
  --ink-2: #666c91;
  --rule: #e0e5f5;
  --accent: #6a78c9;
  --accent-d: #4d5aa8;
  --accent-ink: #ffffff;
  --pink: #f4b6c9;
  --pink-2: #fbdde7;
  --lav: #e7e3fa;
  --given: #fbd3df;
  --ok: #2f9e77;
  --bad: #dc4f6b;
  --bad-bg: #ffe1e7;
  --shadow: 0 6px 16px rgba(60, 80, 140, 0.16);
  --wall: #2b2f55;
  --door: #fff3cf;
  --wood-a: #f7dbe2; --wood-b: #ebbccb;
  --check-a: #fde9ef; --check-c: #f6c7d6;
  --tile-a: #e3e7fb; --tile-b: #cdd4f3;
  --diamond-a: #ece3f8; --diamond-c: #d6c8f0;
  --grass-a: #cdeac3; --grass-c: #a9d89d;
  --steel-a: #dde3f2; --steel-b: #bcc6e0;
  --fu: #f0a3b9; --fu2: #c9bdf0; --fw: #ffffff; --fpot: #b5806a; --fg: #6dbb84; --fg2: #4f9f6c; --ftv: #3a3f6b; --win: #bfe2f7;
  --s0: #f08a5d;
  --s1: #3bb39f;
  --s2: #8e7cf0;
  --s3: #ee6fa5;
  --s4: #e8b730;
  --display: 'Yellowtail', 'Brush Script MT', cursive;
  --sans: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: var(--sans);
  --tw: 46px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171c3d;
    --panel: #252b57;
    --panel-2: #323a70;
    --cell: #1d2348;
    --ink: #eef0ff;
    --ink-2: #aeb4da;
    --rule: #353d6b;
    --accent: #8d9cf0;
    --accent-d: #5f6ec9;
    --accent-ink: #11153a;
    --pink: #c97b97;
    --pink-2: #4a2f55;
    --lav: #343b72;
    --given: #6b3f66;
    --ok: #4fd68c;
    --bad: #ff7d93;
    --bad-bg: #55243c;
    --shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    --wall: #0b0e24;
    --door: #ffe9a8;
    --wood-a: #5b4666; --wood-b: #6e5780;
    --check-a: #5a4465; --check-c: #6c5379;
    --tile-a: #3d4676; --tile-b: #4b5590;
    --diamond-a: #46407a; --diamond-c: #574f90;
    --grass-a: #3b6b55; --grass-c: #4b806a;
    --steel-a: #424a78; --steel-b: #545d93;
    --fu: #c97b97; --fu2: #8d82cf; --fw: #eef0ff; --fg: #58ab78; --fg2: #3f8f5f; --win: #8fc0e8;
    --s0: #ff9a6e;
    --s1: #4fd1bb;
    --s2: #a99aff;
    --s3: #ff86b8;
    --s4: #f2c53f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171c3d;
  --panel: #252b57;
  --panel-2: #323a70;
  --cell: #1d2348;
  --ink: #eef0ff;
  --ink-2: #aeb4da;
  --rule: #353d6b;
  --accent: #8d9cf0;
  --accent-d: #5f6ec9;
  --accent-ink: #11153a;
  --pink: #c97b97;
  --pink-2: #4a2f55;
  --lav: #343b72;
  --given: #6b3f66;
  --ok: #4fd68c;
  --bad: #ff7d93;
  --bad-bg: #55243c;
  --shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
  --wall: #0b0e24;
  --door: #ffe9a8;
  --wood-a: #5b4666; --wood-b: #6e5780;
  --check-a: #5a4465; --check-c: #6c5379;
  --tile-a: #3d4676; --tile-b: #4b5590;
  --diamond-a: #46407a; --diamond-c: #574f90;
  --grass-a: #3b6b55; --grass-c: #4b806a;
  --steel-a: #424a78; --steel-b: #545d93;
  --fu: #c97b97; --fu2: #8d82cf; --fw: #eef0ff; --fg: #58ab78; --fg2: #3f8f5f; --win: #8fc0e8;
  --s0: #ff9a6e;
  --s1: #4fd1bb;
  --s2: #a99aff;
  --s3: #ff86b8;
  --s4: #f2c53f;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 var(--sans);
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
.app { max-width: 1040px; margin: 0 auto; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* En-tête */
.top {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 14px 20px; margin-bottom: 18px;
}
.brand { min-width: 0; }
h1 { margin: 0; font: 400 clamp(60px, 18vw, 84px)/0.9 var(--display); color: var(--ink); text-shadow: 3px 4px 0 var(--pink); }
.dossier {
  margin: 8px 0 0; display: inline-block; font: 700 13px/1.2 var(--sans); color: var(--ink);
  background: var(--panel); padding: 5px 12px; border-radius: 999px; box-shadow: var(--shadow);
}
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls .seg { flex: 1 1 auto; }
.controls .seg button { flex: 1 1 auto; }
.seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: var(--panel); box-shadow: var(--shadow); }
.seg button {
  border: 0; background: transparent; padding: 8px 14px; min-height: 40px; border-radius: 999px;
  font: 700 14.5px var(--sans); cursor: pointer; color: var(--ink-2);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 var(--accent-d); }

.btn {
  border: 0; background: var(--panel); color: var(--ink); box-shadow: var(--shadow);
  padding: 9px 16px; min-height: 42px; border-radius: 999px; font: 800 14.5px var(--sans); cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--bad); color: #fff; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2); }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: 13.5px; }
.btn:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, summary:focus-visible, input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Mise en page */
.layout { display: flex; flex-direction: column; gap: 18px; }
.col { display: contents; }
#case { order: 1; } #suspects { order: 2; } #map-panel { order: 3; } #board-panel { order: 4; }
#verdict { order: 5; } #clues-panel { order: 6; } #rules { order: 7; }
#suspects[hidden] { display: none; }
@media (min-width: 900px) {
  .layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 22px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  #case, #suspects, #map-panel, #board-panel, #verdict, #clues-panel, #rules { order: 0; }
}
.panel { background: var(--panel); border-radius: 20px; box-shadow: var(--shadow); padding: 14px; min-width: 0; }
@media (min-width: 480px) { .panel { padding: 18px; } :root { --tw: 60px; } }
.panel-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.label { margin: 0; font: 800 19px/1.1 var(--sans); color: var(--ink); }
.sub { font: 700 13px var(--sans); color: var(--ink-2); }

/* L'affaire */
.eyebrow {
  display: inline-block; margin: 0 0 8px; padding: 3px 11px; border-radius: 999px; background: var(--pink-2); color: var(--bad);
  font: 800 12px/1.4 var(--sans); letter-spacing: 0.08em; text-transform: uppercase;
}
.case h2 { margin: 0 0 8px; font: 800 21px/1.25 var(--sans); text-wrap: balance; }
.case h2 em { font-style: normal; background: var(--pink-2); padding: 0 8px; border-radius: 8px; white-space: nowrap; }
.case p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.case p b { color: var(--ink); font-weight: 800; }

/* Polaroïds */
.pola {
  margin: 0; padding: 5px 5px 0; background: #fff; color: #2b2f55; border: 1.5px solid #2b2f55; border-radius: 4px;
  box-shadow: 0 3px 8px rgba(43, 47, 85, 0.22); min-width: 0;
}
.pola-img { aspect-ratio: 1; overflow: hidden; background: color-mix(in srgb, var(--c) 40%, #fff); border: 1.5px solid rgba(43, 47, 85, 0.5); }
.pola-img svg { display: block; width: 100%; height: 100%; }
.pola figcaption { text-align: center; padding: 1px 0 6px; line-height: 1.1; }
.pola .pn { display: block; font: 400 22px/1.1 var(--display); overflow-wrap: anywhere; }
.pola small { display: block; font: 700 12px/1.2 var(--sans); color: #666c91; }
.pola .guilty { color: #dc4f6b; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; }
.strip { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; padding: 2px 4px 6px; }
@media (min-width: 600px) { .strip { grid-template-columns: repeat(var(--N), minmax(0, 1fr)); } }
.strip .pola:nth-child(odd) { transform: rotate(-1.6deg); }
.strip .pola:nth-child(even) { transform: rotate(1.3deg); }
.mini { display: inline-block; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex: none; background: color-mix(in srgb, var(--c) 45%, #fff); border: 2.5px solid var(--c); }
.mini svg { display: block; width: 100%; height: 100%; }

/* Plan */
.chips { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.chip {
  border: 0; background: var(--panel-2); border-radius: 999px; padding: 4px 0; min-height: 34px;
  font: 700 13px var(--sans); color: var(--ink-2); cursor: pointer; position: relative; font-variant-numeric: tabular-nums;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 var(--accent-d); }
.chip.crime::after { content: ""; position: absolute; top: -2px; right: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--bad); border: 2px solid var(--panel); }
.plan { display: block; width: 100%; height: auto; overflow: visible; }
.pt-wood .pa-a { fill: var(--wood-a); } .pt-wood .pa-b { stroke: var(--wood-b); fill: none; stroke-width: 0.9; }
.pt-check .pa-a { fill: var(--check-a); } .pt-check .pa-c { fill: var(--check-c); }
.pt-tile .pa-a { fill: var(--tile-a); } .pt-tile .pa-b { stroke: var(--tile-b); fill: none; stroke-width: 1; }
.pt-diamond .pa-a { fill: var(--diamond-a); } .pt-diamond .pa-c { fill: var(--diamond-c); }
.pt-grass .pa-a { fill: var(--grass-a); } .pt-grass .pa-c { fill: var(--grass-c); }
.pt-steel .pa-a { fill: var(--steel-a); } .pt-steel .pa-b { stroke: var(--steel-b); fill: none; stroke-width: 0.9; }
.furn .fu { fill: var(--fu); } .furn .fu2 { fill: var(--fu2); } .furn .fw { fill: var(--fw); } .furn .fpot { fill: var(--fpot); }
.furn .fg { fill: var(--fg); } .furn .fg2 { fill: var(--fg2); } .furn .ftv { fill: var(--ftv); } .furn .win { fill: var(--win); }
.furn .fl { stroke: var(--wall); stroke-opacity: 0.35; stroke-width: 0.9; fill: none; }
.furn rect, .furn ellipse, .furn circle { stroke: var(--wall); stroke-opacity: 0.35; stroke-width: 0.8; }
.deco .rail { stroke: var(--wall); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.deco .wheel { fill: var(--panel-2); stroke: var(--wall); stroke-width: 2.4; }
.wall { fill: none; stroke: var(--wall); stroke-width: 3.4; stroke-linejoin: round; }
.crimeroom { fill: none; stroke: var(--bad); stroke-width: 2.2; stroke-dasharray: 6 4; }
.door { fill: var(--door); stroke: var(--wall); stroke-width: 1.2; }
.pill rect { fill: #fff; stroke: #2b2f55; stroke-width: 1.1; }
.pill text { font: 800 7.6px var(--sans); letter-spacing: 0.04em; fill: #2b2f55; text-anchor: middle; dominant-baseline: central; }
.crimemark polygon { fill: var(--bad); stroke: #fff; stroke-width: 1.8; stroke-linejoin: round; }
.crimemark path { stroke: #fff; stroke-width: 2.2; stroke-linecap: round; fill: none; }
.tok .halo { fill: #fff; opacity: 0.9; }
.tok .face { fill: color-mix(in srgb, var(--c) 45%, #fff); }
.tok .ring { fill: none; stroke: var(--c); stroke-width: 2.4; }
.tok.culprit .ring { stroke: var(--bad); stroke-width: 3.6; }
.legend { margin: 12px 0 0; font: 700 13px var(--sans); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 10px; }
.legend span { background: var(--panel-2); border-radius: 999px; padding: 4px 11px; display: inline-flex; align-items: center; }
.legend i { display: inline-block; margin-right: 7px; }
.legend .lg-door { width: 16px; height: 8px; background: var(--door); border: 1.5px solid var(--wall); border-radius: 2px; }
.legend .lg-crime { width: 16px; height: 11px; border: 2px dashed var(--bad); border-radius: 2px; }

/* Chronologie */
.s0 { --c: var(--s0); } .s1 { --c: var(--s1); } .s2 { --c: var(--s2); } .s3 { --c: var(--s3); } .s4 { --c: var(--s4); }
.board { display: grid; grid-template-columns: var(--tw) repeat(var(--cols), minmax(0, 1fr)); gap: 6px; align-items: stretch; }
.who { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; padding: 0 1px 4px; min-width: 0; text-align: center; }
.who b { font-weight: 800; font-size: 13px; max-width: 100%; overflow-wrap: anywhere; line-height: 1.1; }
.who small { font-size: 10.5px; color: var(--ink-2); line-height: 1; font-weight: 700; }
.time {
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px;
  min-height: 48px; padding: 0 6px; border: 0; border-radius: 12px; background: transparent;
  font: 800 13px var(--sans); color: var(--ink-2); cursor: pointer; text-align: left; font-variant-numeric: tabular-nums;
}
.time.sel { background: var(--panel-2); color: var(--ink); }
.time small { font: 800 9.5px/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--bad); }
.cell {
  position: relative; min-height: 48px; min-width: 0; padding: 2px 3px;
  border: 2px solid var(--rule); border-radius: 12px; box-shadow: inset 5px 0 0 var(--c);
  background: var(--cell); color: var(--ink); font: 700 13px var(--sans);
  cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
}
.board.dense .cell { font-size: 11.5px; }
.cell.empty { color: var(--ink-2); }
.cell.empty::before { content: "·"; }
.cell.given { background: var(--given); border-color: transparent; cursor: default; }
.cell.given svg { position: absolute; top: 4px; right: 4px; color: var(--ink); opacity: 0.7; }
.cell.bad { background: var(--bad-bg); border-color: var(--bad); }
.cell:disabled { color: var(--ink); opacity: 1; }
.status { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; font: 700 13px var(--sans); color: var(--ink-2); }
.status .err { color: var(--bad); font-weight: 800; }
.actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 2px dashed var(--rule); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 36px; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.loading { padding: 28px 0; text-align: center; font: 700 14px var(--sans); color: var(--ink-2); }
/* la grille se pose sur une feuille au bord déchiré */
#board-panel {
  padding-bottom: 22px; box-shadow: none; border-radius: 16px 16px 0 0;
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 16px 100%;
  mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 16px 100%;
}

/* Verdict */
.verdict { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; border: 3px solid var(--bad); }
.v-top { display: flex; align-items: center; gap: 18px; width: 100%; }
.v-top .pola { width: 104px; flex: none; transform: rotate(-3deg); }
.stamp {
  display: inline-block; font: 800 25px/1.05 var(--sans); text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--bad); border: 4px double var(--bad); border-radius: 10px; padding: 8px 12px; transform: rotate(-5deg);
}
.verdict p { margin: 0; }
.verdict .sub { color: var(--ink-2); }

/* Constats */
.opts { margin: -2px 0 8px; }
.clues { list-style: none; margin: 0; padding: 0; }
.clue { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 8px 2px; border-top: 2px dashed var(--rule); font-size: 15px; }
.clues .clue:first-child { border-top: 0; }
.clue .ico {
  width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--rule);
  display: grid; place-items: center; color: var(--accent-ink); background: var(--panel);
}
.clue.ok .ico { background: var(--ok); border-color: var(--ok); color: #fff; }
.clue.bad .ico { background: var(--bad); border-color: var(--bad); color: #fff; }
.clue.ok .txt { color: var(--ink-2); }
.clue.bad .txt { color: var(--bad); font-weight: 800; }
.clue.rule .txt { font-weight: 800; }
.clue.rule.ok .txt { font-weight: 400; }
.empty-note { margin: 0; padding: 10px 0 2px; color: var(--ink-2); font-size: 14px; }

/* Règles */
.rules summary { cursor: pointer; font: 800 19px/1.1 var(--sans); color: var(--ink); list-style-position: inside; padding: 4px 0; }
.rules ol { margin: 12px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); font-size: 15px; }
.rules ol b { color: var(--ink); font-weight: 800; }

/* Sélecteur de pièce */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(15, 20, 50, 0.55); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto;
  background: var(--panel); border-radius: 26px 26px 0 0; box-shadow: 0 -8px 30px rgba(15, 20, 50, 0.3);
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise 0.18s ease-out; } @keyframes rise { from { transform: translateY(24px); opacity: 0; } } }
.sheet-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.sheet-hd b { font: 800 17px var(--sans); }
.trail { margin: 0 0 12px; font: 700 13px var(--sans); color: var(--ink-2); overflow-wrap: anywhere; }
.trail b { color: var(--ink); }
.room-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.room-btn { overflow-wrap: anywhere;
  min-height: 52px; padding: 6px 4px; border: 0; border-radius: 14px; background: var(--panel-2);
  font: 800 14px/1.1 var(--sans); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.room-btn small { font: 700 11px var(--sans); color: var(--ink-2); }
.room-btn.far { background: transparent; box-shadow: inset 0 0 0 2px var(--rule); color: var(--ink-2); font-weight: 700; }
.room-btn.cur { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 var(--accent-d); }
.room-btn.cur small { color: var(--accent-ink); }
.sheet-ft { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }

/* Modes « menteur » : polaroïd + bulles */
.liar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; padding-top: 12px; border-top: 2px dashed var(--rule); }
.liar-q { font: 400 26px/1 var(--display); color: var(--bad); }
.liar-btns { display: flex; flex-wrap: wrap; gap: 8px; }
