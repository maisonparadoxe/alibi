<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alibi · L’Express de minuit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Patrick+Hand&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Concept : album de BD franco-belge « ligne claire ». Papier crème, cadres noirs francs, aplats,
   titres en lettres de couverture, bulles lettrées à la main. Le jeu est une planche : on lit l'histoire,
   puis on mène l'enquête dans les cases suivantes. */
:root {
  --bg: #efe5cc;
  --paper: #fbf5e6;
  --panel-2: #f2e8cf;
  --cell: #fffdf7;
  --ink: #1c1b22;
  --ink-2: #5d5747;
  --frame: #1c1b22;
  --rule: #ddd0b0;
  --accent: #25426f;
  --accent-ink: #fbf5e6;
  --red: #c8343a;
  --red-bg: #f8d9d2;
  --gold: #e3b23c;
  --given: #f6dd9a;
  --ok: #2f7d4f;
  --cap: #f6dd9a;
  --s0: #2d62b0;
  --s1: #2f8a5b;
  --s2: #d4762a;
  --s3: #8a4fa8;
  --s4: #b8432a;
  --title: 'Alfa Slab One', 'Rockwell', Georgia, serif;
  --letter: 'Patrick Hand', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --sans: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --tw: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a28;
    --paper: #1f2738;
    --panel-2: #2a3448;
    --cell: #19202f;
    --ink: #f4ead2;
    --ink-2: #b9b09a;
    --frame: #05070c;
    --rule: #364056;
    --accent: #8fb0ea;
    --accent-ink: #141a28;
    --red: #ff6b5e;
    --red-bg: #4a2228;
    --given: #5a4a1e;
    --ok: #5fd39b;
    --s0: #6f9ce8;
    --s1: #4fc08a;
    --s2: #f0995a;
    --s3: #b98ad6;
    --s4: #e57b62;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a28; --paper: #1f2738; --panel-2: #2a3448; --cell: #19202f; --ink: #f4ead2; --ink-2: #b9b09a;
  --frame: #05070c; --rule: #364056; --accent: #8fb0ea; --accent-ink: #141a28; --red: #ff6b5e; --red-bg: #4a2228;
  --given: #5a4a1e; --ok: #5fd39b; --s0: #6f9ce8; --s1: #4fc08a; --s2: #f0995a; --s3: #b98ad6; --s4: #e57b62;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
[class], body { font-variant-ligatures: none; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.42 var(--sans);
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
.app { max-width: 1040px; margin: 0 auto; }
.mono { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* En-tête de couverture */
.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 14px; }
h1 {
  margin: 0; font: 400 clamp(46px, 14vw, 72px)/0.95 var(--title); letter-spacing: 0.02em; text-transform: uppercase;
  color: var(--red); -webkit-text-stroke: 2px var(--frame); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--frame);
}
.mode-tag { margin: 0; font: 400 17px var(--letter); color: var(--ink-2); }

/* Planche d'introduction */
.kicker { margin: 0 0 2px; font: 400 18px var(--letter); color: var(--ink-2); }
.lvl-title { margin: 0 0 12px; font: 400 26px/1.15 var(--title); text-wrap: balance; }
.lvl-title span { display: inline-block; font-size: 15px; vertical-align: middle; padding: 3px 9px 2px; margin-right: 6px; background: var(--red); color: #fff; border: 2px solid var(--frame); transform: rotate(-2deg); }
.planche { display: grid; gap: 10px; }
@media (min-width: 700px) { .planche { grid-template-columns: 1fr 1fr; } .bd-panel.wide { grid-column: 1 / -1; } }
.bd-panel {
  position: relative; margin: 0; overflow: hidden; border: 3px solid var(--frame); background: #22345a;
  display: flex; flex-direction: column; min-height: 230px;
}
.bd-panel.wide { min-height: 190px; }
.bd-bg { position: absolute; inset: 0; }
.bd-bg svg { width: 100%; height: 100%; display: block; }
.bd-top { position: relative; z-index: 3; padding: 10px 10px 0; display: flex; flex-direction: column; gap: 8px; }
.bd-bubbles { display: flex; gap: 10px; align-items: flex-start; }
.bd-stage { position: relative; z-index: 1; flex: 1 0 150px; min-height: 150px; }
.bd-stage.empty { min-height: 40px; }
.bd-char { position: absolute; bottom: -4px; max-width: 170px; }
.bd-char svg { display: block; width: 100%; height: auto; }
.bd-char.flip svg { transform: scaleX(-1); }
.bd-bottom { position: relative; padding: 0 10px 10px; display: flex; justify-content: flex-end; }
.bd-bottom:empty { display: none; }
.bd-cap {
  margin: 0; max-width: 88%; padding: 6px 10px; background: var(--cap); color: #1c1b22; border: 2px solid #1c1b22;
  font: 400 15.5px/1.25 var(--letter);
}
.cap-br, .cap-b { margin-top: -18px; position: relative; z-index: 2; }
.cap-b { max-width: 100%; }
.bubble {
  position: relative; margin: 0 0 12px; flex: 1 1 0; padding: 8px 11px; background: #fffdf7; color: #1c1b22;
  border: 2px solid #1c1b22; border-radius: 18px / 16px; font: 400 16px/1.22 var(--letter);
}
.bubble::after, .bubble::before { content: ""; position: absolute; top: 100%; border-style: solid; }
.bubble::before { border-width: 13px 8px 0 8px; border-color: #1c1b22 transparent transparent; }
.bubble::after { border-width: 10px 6px 0 6px; border-color: #fffdf7 transparent transparent; margin-top: -1px; }
.bubble.tail-l::before { left: 22px; } .bubble.tail-l::after { left: 24px; }
.bubble.tail-r::before { right: 22px; } .bubble.tail-r::after { right: 24px; }
.go { margin: 12px 0 0; }

/* Boutons */
.btn {
  display: inline-block; text-decoration: none; border: 2px solid var(--frame); background: var(--paper); color: var(--ink);
  padding: 8px 14px; min-height: 42px; border-radius: 3px; font: 800 14.5px var(--sans); cursor: pointer; box-shadow: 2px 2px 0 var(--frame);
}
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.sm { min-height: 38px; padding: 5px 12px; font-size: 13.5px; }
.btn.accuse { background: var(--red); color: #fff; }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Mise en page du jeu */
.layout { display: flex; flex-direction: column; gap: 16px; margin-top: 22px; }
.col { display: contents; }
#case { order: 1; } #suspects { order: 2; } #map-panel { order: 3; } #board-panel { order: 4; } #verdict { order: 5; } #clues-panel { order: 6; } #rules { order: 7; }
@media (min-width: 900px) {
  .layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 20px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  #case, #suspects, #map-panel, #board-panel, #verdict, #clues-panel, #rules { order: 0; }
}
.panel { background: var(--paper); border: 3px solid var(--frame); padding: 14px; min-width: 0; scroll-margin-top: 12px; }
@media (min-width: 480px) { .panel { padding: 16px; } :root { --tw: 58px; } }
.panel-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.label { margin: 0; font: 400 19px/1.1 var(--title); }
.sub { font: 400 16px var(--letter); color: var(--ink-2); }

/* L'affaire : récitatif */
.case { background: var(--cap); color: #1c1b22; }
.eyebrow { display: inline-block; margin: 0 0 8px; padding: 2px 9px; background: var(--red); color: #fff; border: 2px solid #1c1b22; font: 400 15px var(--letter); transform: rotate(-1.5deg); }
.case h2 { margin: 0 0 6px; font: 400 21px/1.25 var(--title); text-wrap: balance; }
.case h2 em { font-style: normal; background: #fffdf7; border: 2px solid #1c1b22; padding: 0 6px; white-space: nowrap; }
.case p { margin: 0; color: #3a3426; }
.case p b { color: #1c1b22; }

/* Fiches des suspects */
.fiches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fiche { margin: 0; background: #fffdf7; color: #1c1b22; border: 2px solid #1c1b22; min-width: 0; }
.fiche-img { aspect-ratio: 1; background: color-mix(in srgb, var(--c) 32%, #fffdf7); border-bottom: 2px solid #1c1b22; overflow: hidden; }
.fiche-img svg { display: block; width: 100%; height: 100%; }
.fiche figcaption { text-align: center; padding: 3px 4px 6px; line-height: 1.1; }
.fiche .fn { display: block; font: 400 17px var(--title); }
.fiche small { display: block; font: 400 15px var(--letter); color: #5d5747; }
.fiche .guilty { color: var(--red); font-weight: 400; }
.mini { display: inline-block; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex: none; background: color-mix(in srgb, var(--c, #e1c48f) 35%, #fffdf7); border: 2px solid #1c1b22; vertical-align: middle; }
.mini svg { display: block; width: 100%; height: 100%; }

/* Train */
.chips { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 5px; margin-bottom: 10px; }
.chip { border: 2px solid var(--frame); background: var(--paper); border-radius: 3px; padding: 3px 0; min-height: 36px; font: 800 13px var(--sans); color: var(--ink); cursor: pointer; position: relative; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip.crime::after { content: ""; position: absolute; top: -6px; right: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--red); border: 2px solid var(--frame); }
.train-frame { border: 3px solid #1c1b22; margin: 0 -2px; }
.lc-train { display: block; width: 100%; height: auto; }
.lc-plate { font: 400 6px var(--title); letter-spacing: 0.05em; text-anchor: middle; dominant-baseline: central; fill: #1c1b22; }
.lc-plate.crime { fill: #fff; }
.lc-roof-t { font: 400 7px var(--title); letter-spacing: 0.2em; text-anchor: middle; fill: rgba(244, 234, 210, 0.6); }
.lc-tok.culprit { filter: drop-shadow(0 0 2px #e2483d) drop-shadow(0 0 2px #e2483d); }
.legend { margin: 10px 0 0; font: 400 15px var(--letter); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend i { display: inline-block; margin-right: 6px; vertical-align: middle; }
.lg-door { width: 10px; height: 14px; background: #2a2a30; border: 2px solid #1c1b22; }
.lg-ladder { width: 12px; height: 6px; background: var(--gold); border: 2px solid #1c1b22; }
.lg-crime { width: 16px; height: 12px; border: 2px dashed #e2483d; }

/* Chronologie */
.s0 { --c: var(--s0); } .s1 { --c: var(--s1); } .s2 { --c: var(--s2); } .s3 { --c: var(--s3); } .s4 { --c: var(--s4); }
.board { display: grid; grid-template-columns: var(--tw) repeat(var(--cols), minmax(0, 1fr)); gap: 6px; }
.who { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; padding-bottom: 4px; min-width: 0; text-align: center; }
.who .mini { width: 36px; height: 36px; border-color: var(--c); border-width: 3px; }
.who b { font: 400 15px/1.05 var(--title); overflow-wrap: anywhere; }
.who small { font: 400 14px/1 var(--letter); color: var(--ink-2); }
.time { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1px; min-height: 48px; padding: 0 5px; border: 2px solid transparent; border-radius: 3px; background: transparent; font: 800 13px var(--sans); color: var(--ink-2); cursor: pointer; font-variant-numeric: tabular-nums; }
.time.sel { border-color: var(--frame); background: var(--panel-2); color: var(--ink); }
.time small { font: 400 13px/1 var(--letter); color: var(--red); }
.cell {
  position: relative; min-height: 48px; min-width: 0; padding: 2px 3px; border: 2px solid var(--frame); border-radius: 3px;
  box-shadow: inset 6px 0 0 var(--c); background: var(--cell); color: var(--ink); font: 800 13px var(--sans);
  cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
}
.cell.empty { color: var(--ink-2); }
.cell.empty::before { content: "·"; }
.cell.given { background: var(--given); cursor: default; }
.cell.given svg { position: absolute; top: 3px; right: 4px; opacity: 0.75; }
.cell.bad { background: var(--red-bg); border-color: var(--red); }
.cell:disabled { color: var(--ink); opacity: 1; }
.status { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font: 400 16px var(--letter); color: var(--ink-2); }
.status .err { color: var(--red); }
.reply { display: flex; align-items: flex-end; gap: 8px; margin-top: 12px; }
.reply.r { justify-content: flex-end; }
.reply .bubble.small { flex: 0 1 auto; margin: 0; font-size: 15px; }
.reply .bubble.small::before, .reply .bubble.small::after { display: none; }
.reply .mini { width: 38px; height: 38px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 2px dashed var(--rule); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 700; cursor: pointer; min-height: 36px; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.hintline { margin: 10px 0 0; font: 400 15px/1.3 var(--letter); color: var(--ink-2); }

/* Carnet (constats) */
.opts { margin: -2px 0 6px; }
.clues { list-style: none; margin: 0; padding: 0; }
.clue { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 8px 2px; border-top: 2px dashed var(--rule); font-size: 15.5px; }
.clue:first-child { border-top: 0; }
.clue .ico { width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--frame); display: grid; place-items: center; color: #fff; background: var(--paper); }
.clue.ok .ico { background: var(--ok); }
.clue.bad .ico { background: var(--red); }
.clue.ok .txt { color: var(--ink-2); }
.clue.bad .txt { color: var(--red); font-weight: 800; }
.clue.rule .txt { font-weight: 800; }
.empty-note { margin: 0; color: var(--ink-2); }

/* Verdict */
.verdict { display: flex; flex-direction: column; gap: 12px; border-color: var(--red); }
.v-top { display: flex; align-items: center; gap: 16px; }
.v-top .fiche { width: 104px; flex: none; transform: rotate(-3deg); }
.stamp { font: 400 26px/1.05 var(--title); text-transform: uppercase; color: var(--red); border: 4px double var(--red); padding: 8px 12px; transform: rotate(-5deg); }
.verdict p { margin: 0; }
.verdict .sub { color: var(--ink-2); font-size: 16px; }
.planche.epi { grid-template-columns: 1fr; }
.next { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.soon { font: 400 16px var(--letter); color: var(--ink-2); }

/* Règles */
.rules summary { cursor: pointer; font: 400 19px var(--title); }
.rules ol { margin: 12px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 7px; color: var(--ink-2); font-size: 15px; }
.rules ol b { color: var(--ink); }

/* Feuilles (choix de voiture, accusation) */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 12, 20, 0.6); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; background: var(--paper);
  border: 3px solid var(--frame); border-bottom: 0;
  padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise 0.16s ease-out; } @keyframes rise { from { transform: translateY(20px); } } }
.sheet-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.sheet-hd b { font: 400 18px var(--title); }
.trail { margin: 0 0 12px; font: 400 16px var(--letter); color: var(--ink-2); overflow-wrap: anywhere; }
.trail b { color: var(--ink); }
.room-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.room-btn { min-height: 52px; padding: 6px 4px; border: 2px solid var(--frame); border-radius: 3px; background: var(--cell); font: 800 14px/1.1 var(--sans); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; overflow-wrap: anywhere; }
.room-btn small { font: 400 14px var(--letter); color: var(--ink-2); }
.room-btn.far { border-style: dashed; color: var(--ink-2); font-weight: 700; }
.room-btn.cur { background: var(--accent); color: var(--accent-ink); }
.room-btn.cur small { color: var(--accent-ink); }
.sheet-ft { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
.acc-t { font: 400 26px var(--title); color: var(--red); }
.acc-grid { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
.acc-btn { border: 0; background: transparent; padding: 0; cursor: pointer; min-width: 0; }
.acc-btn .fiche { box-shadow: 3px 3px 0 var(--frame); }
.acc-btn:active .fiche { transform: translate(2px, 2px); box-shadow: none; }
.acc-btn.out { opacity: 0.45; cursor: default; }
.acc-btn.out .fiche-img { filter: grayscale(1); }

/* lettrage de BD : capitales dans les bulles et les récitatifs */
.bubble, .bd-cap { text-transform: uppercase; letter-spacing: 0.02em; font-size: 15px; line-height: 1.25; }

</style>


</head>

<script>
window.addEventListener('error', function (e) {
  var d = document.getElementById('err-banner');
  if (!d) { d = document.createElement('pre'); d.id = 'err-banner'; d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;margin:0;padding:10px 12px;background:#fff;color:#b00020;font:12px/1.4 monospace;white-space:pre-wrap;border-bottom:3px solid #b00020'; document.body.appendChild(d); }
  d.textContent += 'Erreur : ' + e.message + (e.lineno ? ' (ligne ' + e.lineno + ')' : '') + '\n';
});
</script>

  /* ---------- Mode « un seul menteur » ---------- */

      drop: ['notAt', 'apart', 'move', 'visited', 'never', 'stay', 'together', 'at', 'fact']

    difficile: {

    bad: '<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
    pending: '',
    lock: '<svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M3.4 5.4V4a2.6 2.6 0 0 1 5.2 0v1.4M2.4 5.4h7.2v5.2H2.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>'
  };

  var state = {
    puz: null, grid: [], given: [], selT: 0, live: true, checked: false, hideOk: false,
    picker: null, accuse: false, accused: [], wrong: 0, early: 0, hints: 0, solved: false, lastWrong: -1
  };

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } }
  function $(id) { return document.getElementById(id); }
  function g(s, t) { return state.grid[s * state.puz.T + t]; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function inRoom(r) { return (ROOMS[r].on ? 'sur ' : 'dans ') + ROOMS[r].the; }
  function clueText(c) {
    var s = E.clueText(state.puz, c);
    return c.type === 'crime' ? s.replace('le meurtrier', LV.crimeWord) : s;
  }
  function nameOf(n) { return n === '@culprit' ? SUSPECTS[state.puz.culprit].name : n; }

  /* ---------- Cases de BD ---------- */
  var BG = { night: LC.nightPanel, compartment: LC.compartmentPanel, corridor: LC.corridorPanel };
  function panel(p, k) {
    var chars = p.chars || [], h = '';
    var side = function (who) {
      var c = chars.filter(function (ch) { return ch.name === who; })[0];
      return c && c.x > 40 ? 'r' : 'l';
    };
    var caps = function (where) {
      return (p.captions || []).filter(function (c) { return where.indexOf(c.pos) >= 0; }).map(function (c) {
        return '<p class="bd-cap cap-' + c.pos + '">' + esc(c.text) + '</p>';
      }).join('');
    };
    h += '<figure class="bd-panel' + (p.wide ? ' wide' : '') + (chars.length ? '' : ' nochar') + '">';
    h += '<div class="bd-bg">' + BG[p.bg]() + '</div>';
    h += '<div class="bd-top">' + caps(['tl']);
    if (p.bubbles) {
      h += '<div class="bd-bubbles">' + p.bubbles.map(function (b) {
        return '<p class="bubble tail-' + side(b.who) + '"><span class="sr">' + esc(nameOf(b.who)) + ' : </span>' + esc(b.text) + '</p>';
      }).join('') + '</div>';
    }
    h += '</div>';
    if (chars.length) {
      h += '<div class="bd-stage">' + chars.map(function (c) {
        return '<div class="bd-char' + (c.flip ? ' flip' : '') + '" style="left:' + c.x + '%;width:' + c.w + '%">' + LC.avatar(nameOf(c.name)) + '</div>';
      }).join('') + '</div>';
    } else h += '<div class="bd-stage empty"></div>';
    h += '<div class="bd-bottom">' + caps(['br', 'b']) + '</div>';
    return h + '</figure>';
  }

  function renderIntro() {
    $('intro').innerHTML =
      '<p class="kicker">Chapitre ' + STORY.chapter.n + ' · ' + STORY.chapter.title + '</p>' +
      '<h2 class="lvl-title"><span>Niveau ' + LV.n + '</span> ' + LV.title + '</h2>' +
      '<div class="planche">' + LV.intro.map(panel).join('') + '</div>' +
      '<p class="go"><a class="btn primary" href="#case">Ouvrir l’enquête ↓</a></p>';
  }

  /* ---------- Analyse ---------- */
  function showMarks() { return state.live || state.checked; }
  function analyse() {
    var P = state.puz, T = P.T, bad = {}, errors = 0, s, t, a, b;
    for (s = 0; s < P.S; s++) for (t = 1; t < T; t++) {
      a = g(s, t - 1); b = g(s, t);
      if (a >= 0 && b >= 0 && !((STEP[a] >> b) & 1)) { bad[s * T + t - 1] = 1; bad[s * T + t] = 1; errors++; }
    }
    var list = [{ type: 'crime' }].concat(P.clues.filter(function (c) { return c.type !== 'at'; }));
    var items = list.map(function (c) {
      var st = E.evalClue(P, c, g);
      if (st === 'bad') { errors++; E.badCells(P, c, g).forEach(function (rc) { bad[rc[0] * T + rc[1]] = 1; }); }
      return { c: c, st: st };
    });
    var okCount = 0, filled = 0;
    items.forEach(function (it) { if (it.st === 'ok') okCount++; });
    state.grid.forEach(function (v) { if (v >= 0) filled++; });
    return { bad: bad, errors: errors, items: items, okCount: okCount, filled: filled };
  }
  function gridCorrect() { var sol = state.puz.solution; return state.grid.every(function (v, i) { return v === sol[i]; }); }

  /* ---------- Rendu ---------- */
  function fiche(s, extra) {
    return '<figure class="fiche s' + s + '"><div class="fiche-img">' + LC.avatar(SUSPECTS[s].name) + '</div>' +
      '<figcaption><span class="fn">' + SUSPECTS[s].short + '</span><small>' + (extra || SUSPECTS[s].role) + '</small></figcaption></figure>';
  }
  function mini(s) { return '<span class="mini s' + s + '">' + LC.avatar(SUSPECTS[s].name) + '</span>'; }

  function renderCase() {
    $('case').innerHTML = '<p class="eyebrow">L’affaire</p><h2>' + LV.caseText.title + '</h2><p>' + LV.caseText.body + '</p>';
    var P = state.puz, h = '<div class="panel-hd"><h2 class="label">Les suspects</h2><span class="sub">' + P.S + ' passagers</span></div><div class="fiches">';
    for (var s = 0; s < P.S; s++) h += fiche(s);
    $('suspects').innerHTML = h + '</div>';
  }

  function renderMap() {
    var P = state.puz, T = P.T, t = state.selT, s, i, chips = '';
    for (i = 0; i < T; i++) chips += '<button type="button" class="chip' + (i === P.crime.t ? ' crime' : '') + '" data-act="time" data-t="' + i + '" aria-pressed="' + (i === t) + '">' + tl(i) + '</button>';
    var occ = ROOMS.map(function () { return []; });
    for (s = 0; s < P.S; s++) { var v = g(s, t); if (v >= 0) occ[v].push(s); }
    var names = SUSPECTS.map(function (x) { return x.name; });
    var svg = LC.train({ occ: occ, crime: P.crime.room, labels: LABELS, names: names, culprit: state.solved && t === P.crime.t ? P.culprit : -1, label: 'L’Express en coupe à ' + tl(t) });
    $('map-panel').innerHTML = '<div class="panel-hd"><h2 class="label">L’Express en coupe</h2><span class="sub">à ' + tl(t) + '</span></div>' +
      '<div class="chips" style="--n:' + T + '">' + chips + '</div><div class="train-frame">' + svg + '</div>' +
      '<p class="legend"><span><i class="lg-door"></i>soufflet entre voitures</span><span><i class="lg-ladder"></i>trappe vers le toit</span><span><i class="lg-crime"></i>lieu du vol</span></p>';
  }

  function renderBoard() {
    var P = state.puz, S = P.S, T = P.T, A = analyse(), show = showMarks(), s, t, h = '';
    h += '<div class="panel-hd"><h2 class="label">Chronologie</h2><span class="sub">touche une case</span></div>';
    h += '<div class="board" style="--cols:' + S + '"><div></div>';
    for (s = 0; s < S; s++) h += '<div class="who s' + s + '">' + mini(s) + '<b>' + SUSPECTS[s].short + '</b><small>' + SUSPECTS[s].role + '</small></div>';
    for (t = 0; t < T; t++) {
      h += '<button type="button" class="time' + (t === state.selT ? ' sel' : '') + '" data-act="time" data-t="' + t + '">' + tl(t) + (t === P.crime.t ? '<small>' + LV.crimeNoun + '</small>' : '') + '</button>';
      for (s = 0; s < S; s++) {
        var idx = s * T + t, v = state.grid[idx], given = state.given[idx];
        var cls = 'cell s' + s + (v < 0 ? ' empty' : '') + (given ? ' given' : '') + (show && !given && A.bad[idx] ? ' bad' : '');
        var label = SUSPECTS[s].name + ', ' + tl(t) + ' : ' + (v < 0 ? 'vide' : ROOMS[v].name) + (given ? ' (confirmé)' : '');
        h += '<button type="button" class="' + cls + '" data-act="cell" data-s="' + s + '" data-t="' + t + '" aria-label="' + label + '"' +
          (given || state.solved ? ' disabled' : '') + '>' + (v < 0 ? '' : ROOMS[v].short) + (given ? ICON.lock : '') + '</button>';
      }
    }
    h += '</div>';
    h += '<div class="status"><span>' + A.filled + '/' + (S * T) + ' cases</span>' +
      (show ? '<span class="' + (A.errors ? 'err' : '') + '">' + A.errors + ' contradiction' + (A.errors > 1 ? 's' : '') + '</span>' : '<span>vérification en direct désactivée</span>') +
      (state.wrong && !state.solved ? '<span class="err">' + state.wrong + ' fausse' + (state.wrong > 1 ? 's' : '') + ' accusation' + (state.wrong > 1 ? 's' : '') + '</span>' : '') + '</div>';
    if (state.lastWrong >= 0 && !state.solved) {
      var w = SUSPECTS[state.lastWrong];
      h += '<div class="reply"><span class="mini-wrap">' + mini(state.lastWrong) + '</span><p class="bubble small tail-l">' + esc(LV.wrong[w.name] || 'Vous faites erreur !') + '</p></div>' +
        '<div class="reply r"><p class="bubble small tail-r">Hmm. Son alibi tient. Reprenons la chronologie.</p><span class="mini-wrap"><span class="mini">' + LC.avatar(STORY.detective) + '</span></span></div>';
    }
    if (!state.solved) {
      h += '<div class="actions"><label class="switch"><input type="checkbox" id="live"' + (state.live ? ' checked' : '') + '><span>Vérification en direct</span></label>' +
        '<div class="btns">' + (state.live ? '' : '<button type="button" class="btn sm" data-act="check" title="Contrôle toute la grille d’un coup">Vérifier</button>') +
        '<button type="button" class="btn sm" data-act="hint">Indice</button><button type="button" class="btn sm" data-act="reset">Effacer</button>' +
        '<button type="button" class="btn sm accuse" data-act="accuse">J’accuse !</button></div></div>' +
        '<p class="hintline">' + (state.live ? 'Vérification en direct : les erreurs s’affichent tout de suite en rouge.' : 'Vérification manuelle : rien ne s’affiche tant que tu n’appuies pas sur « Vérifier ».') + '</p>';
    }
    $('board-panel').innerHTML = h;
  }

  function renderClues() {
    var A = analyse(), show = showMarks();
    var h = '<div class="panel-hd"><h2 class="label">Carnet d’Hortense</h2><span class="sub">' + (show ? A.okCount + '/' + A.items.length + ' confirmés' : A.items.length + ' constats') + '</span></div>';
    h += '<label class="switch opts"><input type="checkbox" id="hideok"' + (state.hideOk ? ' checked' : '') + '><span>Masquer les constats confirmés</span></label>';
    var rows = A.items.map(function (it) {
      var st = show ? it.st : 'pending';
      if (state.hideOk && st === 'ok') return '';
      return '<li class="clue ' + st + (it.c.type === 'crime' ? ' rule' : '') + '"><span class="ico">' + ICON[st] + '</span><span class="txt">' + clueText(it.c) + '</span></li>';
    }).join('');
    h += rows ? '<ul class="clues">' + rows + '</ul>' : '<p class="empty-note">Tous les constats sont confirmés.</p>';
    $('clues-panel').innerHTML = h;
  }

  function renderVerdict() {
    var P = state.puz, el = $('verdict');
    if (!state.solved) { el.innerHTML = ''; return; }
    var c = SUSPECTS[P.culprit];
    el.innerHTML = '<div class="panel verdict"><div class="v-top">' + fiche(P.culprit, '<b class="guilty">coupable</b>') + '<div class="stamp">Affaire classée</div></div>' +
      '<p><b>' + c.name + '</b> était ' + (c.f ? 'seule' : 'seul') + ' ' + inRoom(P.crime.room) + ' à ' + tl(P.crime.t) + '. Tous les autres alibis tiennent.</p>' +
      '<p class="sub">' + (state.early ? 'Accusation exacte alors que ' + state.early + ' case' + (state.early > 1 ? 's' : '') + ' restaient à remplir. ' : '') +
      (state.hints ? state.hints + ' indice' + (state.hints > 1 ? 's' : '') + ' utilisé' + (state.hints > 1 ? 's' : '') + '. ' : 'Aucun indice utilisé. ') +
      (state.wrong ? state.wrong + ' fausse' + (state.wrong > 1 ? 's' : '') + ' accusation' + (state.wrong > 1 ? 's' : '') + '.' : 'Aucune fausse accusation.') + '</p>' +
      '<div class="planche epi">' + LV.epilogue.map(panel).join('') + '</div>' +
      '<p class="next"><button type="button" class="btn" data-act="replay">Rejouer ce niveau</button> <span class="soon">Niveau 2 : bientôt</span></p></div>';
  }

  function renderSheet() {
    var root = $('sheet-root'), p = state.picker, P = state.puz;
    if (state.accuse) {
      var ab = '';
      for (var q = 0; q < P.S; q++) {
        var out = state.accused.indexOf(q) >= 0;
        ab += '<button type="button" class="acc-btn' + (out ? ' out' : '') + '" data-act="accpick" data-s="' + q + '"' + (out ? ' disabled' : '') + '>' + fiche(q, out ? 'innocent' : '') + '</button>';
      }
      root.innerHTML = '<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Désigner le coupable">' +
        '<div class="sheet-hd"><b class="acc-t">J’accuse…</b></div><p class="trail">Qui a volé le collier ? Une mauvaise réponse est comptée comme une erreur.</p>' +
        '<div class="acc-grid" style="--n:' + P.S + '">' + ab + '</div><div class="sheet-ft"><button type="button" class="btn sm" data-act="close">Annuler</button></div></div>';
      var f0 = root.querySelector('.acc-btn:not(:disabled)'); if (f0) f0.focus();
      return;
    }
    if (!p) { root.innerHTML = ''; return; }
    var T = P.T, s = p.s, t = p.t, cur = g(s, t);
    var prev = t > 0 ? g(s, t - 1) : -1, next = t < T - 1 ? g(s, t + 1) : -1, trail = [];
    if (t > 0) trail.push(tl(t - 1) + ' ' + (prev >= 0 ? ROOMS[prev].name : '?'));
    trail.push('<b>' + tl(t) + ' ?</b>');
    if (t < T - 1) trail.push(tl(t + 1) + ' ' + (next >= 0 ? ROOMS[next].name : '?'));
    var btns = ROOMS.map(function (room, r) {
      var far = (prev >= 0 && !((STEP[prev] >> r) & 1)) || (next >= 0 && !((STEP[r] >> next) & 1));
      return '<button type="button" class="room-btn' + (r === cur ? ' cur' : '') + (far ? ' far' : '') + '" data-act="pick" data-r="' + r + '">' + room.name + (far ? '<small>trop loin</small>' : '') + '</button>';
    }).join('');
    root.innerHTML = '<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Choisir une voiture">' +
      '<div class="sheet-hd">' + mini(s) + '<b>' + SUSPECTS[s].name + '</b></div><p class="trail">' + trail.join(' → ') + '</p>' +
      '<div class="room-grid">' + btns + '</div><div class="sheet-ft"><button type="button" class="btn sm" data-act="clear">Effacer la case</button><button type="button" class="btn sm" data-act="close">Fermer</button></div></div>';
    var first = root.querySelector('.room-btn.cur') || root.querySelector('.room-btn');
    if (first) first.focus();
  }

  var RULES = [
    'Chaque case de la <b>chronologie</b> indique la voiture où se trouvait un passager à une heure donnée. Touche une case pour la choisir.',
    'Entre deux heures, on <b>reste sur place</b> ou on passe dans une <b>voiture voisine</b> (par le soufflet). Le toit ne se rejoint que par les trappes du wagon-lit B et de la voiture-bar.',
    'Tous les constats du <b>carnet</b> sont vrais, et une seule chronologie les respecte tous.',
    'À l’heure du vol, le voleur était <b>seul</b> dans la voiture du vol. Les cases dorées sont des faits déjà établis.',
    'Pas besoin de tout remplir : dès que tu es sûr, touche <b>J’accuse !</b>. Une mauvaise accusation est comptée comme une erreur.',
    '<b>Vérification en direct</b> : cochée, les erreurs apparaissent aussitôt en rouge. Décochée, le bouton <b>Vérifier</b> contrôle la grille à la demande.'
  ];

  function renderAll() { renderCase(); renderMap(); renderBoard(); renderVerdict(); renderClues(); renderSheet(); }

  function load() {
    var P = JSON.parse(JSON.stringify(LV.puz));
    state.puz = P; state.grid = []; state.given = [];
    for (var i = 0; i < P.S * P.T; i++) { state.grid.push(-1); state.given.push(false); }
    P.clues.forEach(function (c) { if (c.type === 'at') { state.grid[c.s * P.T + c.t] = c.r; state.given[c.s * P.T + c.t] = true; } });
    state.selT = 0; state.checked = false; state.hints = 0; state.solved = false; state.accuse = false; state.accused = []; state.wrong = 0; state.early = 0; state.lastWrong = -1; state.picker = null;
    renderAll();
  }

  function afterChange() {
    state.checked = false;
    if (!state.solved && gridCorrect()) win(0);
    renderMap(); renderBoard(); renderVerdict(); renderClues();
  }
  function win(early) {
    state.solved = true; state.early = early; state.selT = state.puz.crime.t; state.lastWrong = -1;
    lsSet('alibi.histoire.n1', 'ok');
  }
  function setCell(s, t, v) {
    var idx = s * state.puz.T + t;
    if (state.given[idx] || state.solved) return;
    state.grid[idx] = v; afterChange();
  }
  function closeSheet() {
    var p = state.picker;
    state.picker = null; state.accuse = false; renderSheet();
    if (p) { var el = document.querySelector('.cell[data-s="' + p.s + '"][data-t="' + p.t + '"]'); if (el && !el.disabled) el.focus(); }
  }
  function hint() {
    var P = state.puz, wrong = [];
    state.grid.forEach(function (v, i) { if (v !== P.solution[i]) wrong.push(i); });
    if (!wrong.length) return;
    var i = wrong[Math.floor(Math.random() * wrong.length)];
    state.grid[i] = P.solution[i]; state.given[i] = true; state.hints++; state.selT = i % P.T;
    afterChange();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || !state.puz) return;
    switch (el.getAttribute('data-act')) {
      case 'time': state.selT = +el.getAttribute('data-t'); renderMap(); renderBoard(); break;
      case 'cell':
        if (el.disabled) break;
        state.picker = { s: +el.getAttribute('data-s'), t: +el.getAttribute('data-t') };
        state.selT = state.picker.t; renderMap(); renderBoard(); renderSheet(); break;
      case 'pick': if (state.picker) { var p = state.picker; setCell(p.s, p.t, +el.getAttribute('data-r')); closeSheet(); } break;
      case 'clear': if (state.picker) { var q = state.picker; setCell(q.s, q.t, -1); closeSheet(); } break;
      case 'close': closeSheet(); break;
      case 'check': state.checked = true; renderBoard(); renderClues(); break;
      case 'hint': hint(); break;
      case 'reset': state.grid = state.grid.map(function (v, i) { return state.given[i] ? v : -1; }); state.lastWrong = -1; afterChange(); break;
      case 'accuse': if (!state.solved) { state.accuse = true; renderSheet(); } break;
      case 'accpick':
        var as = +el.getAttribute('data-s'), P2 = state.puz;
        state.accuse = false;
        if (as === P2.culprit) {
          var emp = 0;
          state.grid.forEach(function (v, i) { if (v !== P2.solution[i]) emp++; });
          state.grid = P2.solution.slice(); win(emp);
        } else { state.wrong++; state.accused.push(as); state.lastWrong = as; }
        renderSheet(); renderMap(); renderBoard(); renderVerdict(); renderClues();
        if (state.solved) { var vd = $('verdict'); if (vd && vd.scrollIntoView) vd.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        break;
      case 'replay': load(); window.scrollTo(0, 0); break;
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'live') { state.live = e.target.checked; state.checked = false; renderBoard(); renderClues(); }
    if (e.target.id === 'hideok') { state.hideOk = e.target.checked; renderClues(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (state.picker || state.accuse)) closeSheet(); });

  $('rules-list').innerHTML = RULES.map(function (r) { return '<li>' + r + '</li>'; }).join('');
  renderIntro();
  load();
  window.AlibisHistoire = { state: state, load: load };
})();

</script>

</body>
</html>
