<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alibi · L’Express de minuit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&display=swap">
<style>
/* Concept : épisode de webtoon. On lit l'histoire en faisant défiler de grandes cases pleine largeur
   séparées par du blanc, avec une lumière de cinéma et des bulles ovales. L'enquête suit, sur des
   cartes claires et douces, comme une application de lecture. */
:root {
  --bg: #f6f3ef;
  --gutter: #ffffff;
  --paper: #ffffff;
  --panel-2: #f1ece6;
  --cell: #fbf9f6;
  --ink: #26201f;
  --ink-2: #77706b;
  --line: #e7e0d8;
  --line-2: #d6cdc3;
  --accent: #c2414f;
  --accent-ink: #ffffff;
  --accent-2: #3d5a96;
  --red: #d23c4c;
  --red-bg: #fde4e6;
  --given: #f7e7cf;
  --ok: #2f9a6a;
  --shadow: 0 6px 22px rgba(60, 40, 30, 0.10);
  --s0: #4f7fc4;
  --s1: #2f9a6a;
  --s2: #c9824a;
  --s3: #8a5bb3;
  --s4: #c2414f;
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --tw: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131217; --gutter: #0c0b0f; --paper: #1d1b22; --panel-2: #26232c; --cell: #17151b;
    --ink: #f2ece6; --ink-2: #a49c96; --line: #2e2a33; --line-2: #3d3843;
    --accent: #ef6f7c; --accent-ink: #160c10; --accent-2: #9db7ef; --red: #ff7a86; --red-bg: #3e1d26;
    --given: #4a3a26; --ok: #5fd39b; --shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
    --s0: #7da7ea; --s1: #55c690; --s2: #e7a56d; --s3: #b48ad6; --s4: #ef6f7c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131217; --gutter: #0c0b0f; --paper: #1d1b22; --panel-2: #26232c; --cell: #17151b;
  --ink: #f2ece6; --ink-2: #a49c96; --line: #2e2a33; --line-2: #3d3843;
  --accent: #ef6f7c; --accent-ink: #160c10; --accent-2: #9db7ef; --red: #ff7a86; --red-bg: #3e1d26;
  --given: #4a3a26; --ok: #5fd39b; --shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
  --s0: #7da7ea; --s1: #55c690; --s2: #e7a56d; --s3: #b48ad6; --s4: #ef6f7c;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.5 var(--sans);
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
.app { max-width: 1040px; margin: 0 auto; }
.mono { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 16px; }
h1 { margin: 0; font: 900 clamp(40px, 12vw, 60px)/0.95 var(--serif); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.mode-tag { margin: 0; font: 600 12px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }

/* Épisode : couverture puis bande verticale */
#intro { max-width: 640px; margin: 0 auto; }
.cover { text-align: center; padding: 6px 0 18px; }
.kicker { margin: 0 0 6px; font: 600 12px var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); }
.lvl-title { margin: 0; font: italic 700 30px/1.15 var(--serif); text-wrap: balance; }
.lvl-title span { display: block; margin-bottom: 4px; font: 600 12px var(--sans); font-style: normal; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.strip { background: var(--gutter); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 28px 0 40px; display: flex; flex-direction: column; gap: 46px; }
@media (min-width: 672px) { .strip { margin-inline: 0; border-radius: 6px; } }
.beat { position: relative; }
.says { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 6px; padding: 0 14px; margin-bottom: -26px; }
.wbubble {
  position: relative; margin: 0; max-width: 80%; padding: 20px 28px; background: #fff; color: #231b1b;
  border: 1.6px solid #2a201f; border-radius: 50%; text-align: center;
  font: 600 13.5px/1.35 var(--sans); text-transform: uppercase; letter-spacing: 0.02em; text-wrap: balance;
}
.wbubble.l { align-self: flex-start; }
.wbubble.r { align-self: flex-end; }
.wbubble::after {
  content: ""; position: absolute; top: calc(100% - 4px); width: 18px; height: 22px; background: #fff;
  border-right: 1.6px solid #2a201f; clip-path: polygon(0 0, 100% 0, 100% 100%);
}
.wbubble.l::after { left: 30%; transform: skewX(14deg); }
.wbubble.r::after { right: 30%; transform: scaleX(-1) skewX(14deg); }
.wpanel { position: relative; margin: 0; overflow: hidden; background: #222; }
.wbg, .wbg svg, .wbg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.wchar { position: absolute; bottom: 0; transform: translateX(-50%); }
.wchar .wport { display: block; width: 100%; height: auto; }
.wcap {
  position: absolute; z-index: 2; margin: 0; max-width: 74%; padding: 8px 12px; background: rgba(255, 252, 247, 0.92); color: #231b1b;
  border: 1px solid rgba(40, 30, 30, 0.6); font: 400 13.5px/1.4 var(--sans);
}
.wcap.tl { top: 12px; left: 12px; } .wcap.br { bottom: 12px; right: 12px; } .wcap.bl { bottom: 12px; left: 12px; }
.sfx {
  position: absolute; z-index: 2; white-space: nowrap; font: italic 900 42px/1 var(--serif); color: #fff; transform: rotate(var(--r));
  -webkit-text-stroke: 1.6px #2a201f; paint-order: stroke fill; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
}
.sfx.center { transform: translate(-50%, -50%) rotate(var(--r)); font-size: 54px; color: #ffe0d6; }
.go { text-align: center; margin: 22px 0 0; }

/* Boutons */
.btn {
  display: inline-block; text-decoration: none; border: 1px solid var(--line-2); background: var(--paper); color: var(--ink);
  padding: 9px 16px; min-height: 42px; border-radius: 999px; font: 600 14px var(--sans); cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding-inline: 22px; }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: 13.5px; }
.btn.accuse { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible + span { outline: 3px solid var(--accent-2); outline-offset: 2px; }

/* Jeu */
.layout { display: flex; flex-direction: column; gap: 16px; margin-top: 26px; }
.col { display: contents; }
#case { order: 1; } #suspects { order: 2; } #map-panel { order: 3; } #board-panel { order: 4; } #verdict { order: 5; } #clues-panel { order: 6; } #rules { order: 7; }
@media (min-width: 900px) {
  .layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 20px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  #case, #suspects, #map-panel, #board-panel, #verdict, #clues-panel, #rules { order: 0; }
}
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; min-width: 0; scroll-margin-top: 12px; }
.panel-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.label { margin: 0; font: 700 19px/1.15 var(--serif); }
.sub { font: 600 12px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }

.eyebrow { margin: 0 0 6px; font: 600 12px var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.case h2 { margin: 0 0 6px; font: 700 21px/1.3 var(--serif); text-wrap: balance; }
.case h2 em { font-style: italic; color: var(--accent); }
.case p { margin: 0; color: var(--ink-2); }
.case p b { color: var(--ink); }

.fiches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fiche { margin: 0; min-width: 0; border-radius: 14px; overflow: hidden; background: var(--cell); border: 1px solid var(--line); }
.fiche-img { aspect-ratio: 5 / 6; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, #fff8f2), color-mix(in srgb, var(--c) 45%, #f6efe8)); overflow: hidden; }
.fiche-img svg, .fiche-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
.fiche figcaption { text-align: center; padding: 6px 4px 8px; line-height: 1.15; }
.fiche .fn { display: block; font: 700 16px var(--serif); }
.fiche small { display: block; font: 600 11px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-top: 2px; }
.fiche .guilty { color: var(--red); }
.mini { display: inline-block; width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex: none; background: color-mix(in srgb, var(--c, #c9a48a) 30%, #fff8f2); border: 2px solid var(--c, var(--line-2)); vertical-align: middle; }
.mini svg, .mini img { display: block; width: 100%; height: 100%; transform: scale(1.5) translateY(14%); object-fit: cover; }

.chips { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.chip { border: 1px solid var(--line-2); background: var(--paper); border-radius: 999px; padding: 3px 0; min-height: 36px; font: 600 13px var(--sans); color: var(--ink-2); cursor: pointer; position: relative; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip.crime::after { content: ""; position: absolute; top: -3px; right: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); border: 2px solid var(--paper); }
.train-frame { border-radius: 12px; overflow: hidden; }
.lc-train { display: block; width: 100%; height: auto; }
.lc-train [stroke="#1c1b22"] { stroke: #3a2a28; stroke-width: 0.8; }
.lc-plate { font: 700 5.6px var(--sans); letter-spacing: 0.1em; text-anchor: middle; dominant-baseline: central; fill: #2a2020; }
.lc-plate.crime { fill: #fff; }
.lc-roof-t { font: 700 6.5px var(--sans); letter-spacing: 0.3em; text-anchor: middle; fill: rgba(255, 240, 220, 0.6); }
.lc-tok.culprit { filter: drop-shadow(0 0 2px #ff5a5a) drop-shadow(0 0 3px #ff5a5a); }
.legend { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend i { display: inline-block; margin-right: 6px; vertical-align: middle; }
.lg-door { width: 8px; height: 14px; background: #2a2a30; border-radius: 2px; }
.lg-ladder { width: 12px; height: 5px; background: #e3b23c; border-radius: 2px; }
.lg-crime { width: 16px; height: 12px; border: 2px dashed #e2483d; border-radius: 2px; }

.s0 { --c: var(--s0); } .s1 { --c: var(--s1); } .s2 { --c: var(--s2); } .s3 { --c: var(--s3); } .s4 { --c: var(--s4); }
.board { display: grid; grid-template-columns: var(--tw) repeat(var(--cols), minmax(0, 1fr)); gap: 6px; }
.who { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; padding-bottom: 4px; min-width: 0; text-align: center; }
.who .mini { width: 40px; height: 40px; }
.who b { font: 700 14px/1.1 var(--serif); overflow-wrap: anywhere; }
.who small { font: 600 10.5px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.time { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1px; min-height: 48px; padding: 0 6px; border: 0; border-radius: 10px; background: transparent; font: 600 13px var(--sans); color: var(--ink-2); cursor: pointer; font-variant-numeric: tabular-nums; }
.time.sel { background: var(--panel-2); color: var(--ink); }
.time small { font: 700 9.5px var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }
.cell {
  position: relative; min-height: 48px; min-width: 0; padding: 2px 3px; border: 1px solid var(--line-2); border-radius: 10px;
  box-shadow: inset 0 -3px 0 var(--c); background: var(--cell); color: var(--ink); font: 600 13px var(--sans);
  cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
}
.cell.empty { color: var(--ink-2); }
.cell.empty::before { content: "·"; }
.cell.given { background: var(--given); cursor: default; }
.cell.given svg { position: absolute; top: 4px; right: 5px; opacity: 0.6; }
.cell.bad { background: var(--red-bg); border-color: var(--red); }
.cell:disabled { color: var(--ink); opacity: 1; }
.status { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.status .err { color: var(--red); font-weight: 600; }
.reply { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.reply.r { justify-content: flex-end; }
.reply .bubble.small { margin: 0; padding: 10px 16px; background: #fff; color: #231b1b; border: 1.4px solid #2a201f; border-radius: 22px; font: 600 12.5px/1.35 var(--sans); text-transform: uppercase; }
.reply .mini { width: 42px; height: 42px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; min-height: 36px; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.hintline { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); }

.opts { margin: -2px 0 6px; }
.clues { list-style: none; margin: 0; padding: 0; }
.clue { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 9px 2px; border-top: 1px solid var(--line); font-size: 14.5px; }
.clue:first-child { border-top: 0; }
.clue .ico { width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: #fff; }
.clue.ok .ico { background: var(--ok); border-color: var(--ok); }
.clue.bad .ico { background: var(--red); border-color: var(--red); }
.clue.ok .txt { color: var(--ink-2); }
.clue.bad .txt { color: var(--red); font-weight: 600; }
.clue.rule .txt { font-weight: 600; }
.empty-note { margin: 0; color: var(--ink-2); }

.verdict { display: flex; flex-direction: column; gap: 12px; border-color: var(--red); }
.v-top { display: flex; align-items: center; gap: 16px; }
.v-top .fiche { width: 108px; flex: none; }
.stamp { font: italic 900 28px/1.05 var(--serif); color: var(--red); }
.verdict p { margin: 0; }
.verdict .sub { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13.5px; }
.strip.epi { margin-inline: -16px; border-radius: 0; padding-top: 34px; }
.next { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.soon { font-size: 13px; color: var(--ink-2); }

.rules summary { cursor: pointer; font: 700 18px var(--serif); }
.rules ol { margin: 12px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 7px; color: var(--ink-2); font-size: 14.5px; }
.rules ol b { color: var(--ink); }

.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(15, 10, 12, 0.55); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; background: var(--paper);
  border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25);
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise 0.16s ease-out; } @keyframes rise { from { transform: translateY(20px); } } }
.sheet-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.sheet-hd b { font: 700 17px var(--serif); }
.trail { margin: 0 0 12px; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.trail b { color: var(--ink); }
.room-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.room-btn { min-height: 52px; padding: 6px 4px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--cell); font: 600 13.5px/1.15 var(--sans); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; overflow-wrap: anywhere; }
.room-btn small { font-size: 11px; color: var(--ink-2); font-weight: 400; }
.room-btn.far { border-style: dashed; color: var(--ink-2); }
.room-btn.cur { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.room-btn.cur small { color: var(--paper); }
.sheet-ft { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
.acc-t { font: italic 900 26px var(--serif); color: var(--red); }
.acc-grid { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
.acc-btn { border: 0; background: transparent; padding: 0; cursor: pointer; min-width: 0; text-align: inherit; }
.acc-btn:active .fiche { transform: scale(0.97); }
.acc-btn.out { opacity: 0.45; cursor: default; }
.acc-btn.out .fiche-img { filter: grayscale(1); }

</style>


</head>

  function leakOf(e, crime) {

    switch (e.type) {

  function generate(seed, levelKey, mode) {

        }

        clues.push(picked);

        var res = solve({ S: S, T: T, clues: clues, crime: crime }, 2, 60000);

      }

      var cur = clues.slice();

        if (r2.count === 1 && !r2.aborted) cur = test;
      }
      if (cur.length > L.max) continue;
      cur.sort(function (x, y) {
        return TYPE_RANK[x.type] - TYPE_RANK[y.type] || (x.t || 0) - (y.t || 0) || (x.s || x.a || 0) - (y.s || y.a || 0);
      });

  /* ---------- Mode « un seul menteur » ---------- */
  var NEG = { at: 'notAt', notAt: 'at', together: 'apart', apart: 'together', stay: 'move', move: 'stay', never: 'visited', visited: 'never' };

  function liarClues(puz, L) {

    for (var L = 0; L < S && count < limit; L++) {

      base.push({ type: 'at', s: L, t: puz.crime.t, r: puz.crime.room });

  function solveLiar(puz, limit, cap) {

      if (res.aborted) aborted = true;

      count += res.count;

    return { count: count, aborted: aborted, sols: total };
  }

  function domainScoreLiar(puz) {
    var sum = 0;
    for (var L = 0; L < puz.S; L++) {

        cls.push({ type: 'at', s: L, t: puz.crime.t, r: puz.crime.room });

  var LIAR_LEVELS = {
    facile: {

      w: { fact: 1.5, at: 1.5, notAt: 0.8, together: 2, apart: 1.2, stay: 1.5, move: 1, never: 1.5, visited: 1.5 },
      drop: ['notAt', 'apart', 'move', 'visited', 'never', 'stay', 'together', 'at', 'fact']

    moyen: {
      S: 4, T: 5, max: 24, k: 10, atMax: 2, minSt: 2,
      w: { fact: 1, at: 1.5, notAt: 0.8, together: 2, apart: 1.2, stay: 1.5, move: 1, never: 1.5, visited: 1.5 },
      drop: ['notAt', 'apart', 'move', 'visited', 'never', 'stay', 'together', 'at', 'fact']
    },
    difficile: {
      S: 4, T: 6, max: 30, k: 20, atMax: 1, minSt: 2,
      w: { fact: 0.5, at: 1.2, notAt: 0.8, together: 2, apart: 1.2, stay: 1.5, move: 1, never: 1.8, visited: 1.8 },
      drop: ['fact', 'notAt', 'apart', 'move', 'visited', 'never', 'stay', 'together', 'at']

    facile: Object.assign({}, LIAR_LEVELS.facile, { max: 18, maxSt: 8, atMax: 4, k: 20 }),
    moyen: Object.assign({}, LIAR_LEVELS.moyen, { max: 24, maxSt: 8, atMax: 8, k: 20 }),
    difficile: Object.assign({}, LIAR_LEVELS.difficile, { max: 28, maxSt: 8, atMax: 6, k: 40 })

      var crime = pickCrime(rng, sol, S, T);

  function statementText(puz, c) {
    var by = c.by, me = function (s) { return s === by; };
    var nm = function (s) { return SUSPECTS[s].name; };
    var the = function (r) { return ROOMS[r].the; };
    var loc = function (r) { return (ROOMS[r].on ? 'sur ' : 'dans ') + ROOMS[r].the; };

      case 'at': if (me(c.s)) return "J'étais " + loc(c.r) + ' à ' + timeLabel(c.t) + '.'; break;
      case 'notAt': if (me(c.s)) return "Je n'étais pas " + loc(c.r) + ' à ' + timeLabel(c.t) + '.'; break;
      case 'together':

        break;
      case 'apart':

        break;

      case 'move': if (me(c.s)) return "J'ai changé de " + U() + " entre " + timeLabel(c.t) + ' et ' + timeLabel(c.t + 1) + '.'; break;
      case 'never': if (me(c.s)) return "Je n'ai jamais mis les pieds " + loc(c.r) + ' de la soirée.'; break;
      case 'visited': if (me(c.s)) return "J'ai traversé " + the(c.r) + ' à un moment de la soirée.'; break;

  }

    get ROOMS() { return ROOMS; }, get DOORS() { return DOORS; }, get ADJ() { return ADJ; },
    get STEP() { return STEP; }, get SUSPECTS() { return SUSPECTS; }, get SCENE() { return SCENE; },

    timeLabel: timeLabel, solve: solve, evalClue: evalClue, badCells: badCells,

});

  function nightPanel() {

<script>

(function () {

<script>
(function () {
  'use strict';
  var E = window.AlibisEngine, LC = window.AlibisLC, WT = window.AlibisWT, STORY = window.AlibisStory;
  E.setScene(STORY.chapter.scene);
  var ROOMS = E.ROOMS, SUSPECTS = E.SUSPECTS, STEP = E.STEP, tl = E.timeLabel;
  var LV = STORY.levels[0];
  var LABELS = ['FOURGON', 'LIT A', 'LIT B', 'RESTO', 'BAR', 'FUMOIR'];

  var ICON = {
    ok: '<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    bad: '<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
    pending: '',
    lock: '<svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M3.4 5.4V4a2.6 2.6 0 0 1 5.2 0v1.4M2.4 5.4h7.2v5.2H2.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>'
  };

  var state = {
    puz: null, grid: [], given: [], selT: 0, live: true, checked: false, hideOk: false,
    picker: null, accuse: false, accused: [], wrong: 0, early: 0, hints: 0, solved: false, lastWrong: -1
  };

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } }
  function $(id) { return document.getElementById(id); }
  function g(s, t) { return state.grid[s * state.puz.T + t]; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function inRoom(r) { return (ROOMS[r].on ? 'sur ' : 'dans ') + ROOMS[r].the; }
  function clueText(c) {
    var s = E.clueText(state.puz, c);
    return c.type === 'crime' ? s.replace('le meurtrier', LV.crimeWord) : s;
  }
  function nameOf(n) { return n === '@culprit' ? SUSPECTS[state.puz.culprit].name : n; }

  /* ---------- Cases façon webtoon ---------- */
  function beat(b) {
    var h = '<div class="beat">';
    if (b.say) h += '<div class="says">' + b.say.map(function (q) {
      return '<p class="wbubble ' + (q.side === 'r' ? 'r' : 'l') + '"><span class="sr">' + esc(nameOf(q.who)) + ' : </span>' + esc(q.text) + '</p>';
    }).join('') + '</div>';
    h += '<figure class="wpanel" style="aspect-ratio:1 / ' + b.h + '"><div class="wbg">' + WT.background(b.bg) + '</div>';
    (b.chars || []).forEach(function (c) {
      h += '<div class="wchar" style="left:' + c.x + '%;width:' + c.w + '%">' + WT.portrait(nameOf(c.name), c.expr, 'wport') + '</div>';
    });
    if (b.sfx) h += '<span class="sfx' + (b.sfx.center ? ' center' : '') + '" style="left:' + b.sfx.x + '%;top:' + b.sfx.y + '%;--r:' + (b.sfx.rot || 0) + 'deg" aria-hidden="true">' + esc(b.sfx.text) + '</span>';
    (b.caps || []).forEach(function (c) { h += '<p class="wcap ' + c.pos + '">' + esc(c.text) + '</p>'; });
    return h + '</figure></div>';
  }

  function renderIntro() {
    $('intro').innerHTML =
      '<div class="cover"><p class="kicker">Chapitre ' + STORY.chapter.n + ' · ' + STORY.chapter.title + '</p>' +
      '<h2 class="lvl-title"><span>Épisode ' + LV.n + '</span>' + LV.title + '</h2></div>' +
      '<div class="strip">' + LV.intro.map(beat).join('') + '</div>' +
      '<p class="go"><a class="btn primary" href="#case">Ouvrir l’enquête</a></p>';
  }

  /* ---------- Analyse ---------- */
  function showMarks() { return state.live || state.checked; }
  function analyse() {
    var P = state.puz, T = P.T, bad = {}, errors = 0, s, t, a, b;
    for (s = 0; s < P.S; s++) for (t = 1; t < T; t++) {
      a = g(s, t - 1); b = g(s, t);
      if (a >= 0 && b >= 0 && !((STEP[a] >> b) & 1)) { bad[s * T + t - 1] = 1; bad[s * T + t] = 1; errors++; }
    }
    var list = [{ type: 'crime' }].concat(P.clues.filter(function (c) { return c.type !== 'at'; }));
    var items = list.map(function (c) {
      var st = E.evalClue(P, c, g);
      if (st === 'bad') { errors++; E.badCells(P, c, g).forEach(function (rc) { bad[rc[0] * T + rc[1]] = 1; }); }
      return { c: c, st: st };
    });
    var okCount = 0, filled = 0;
    items.forEach(function (it) { if (it.st === 'ok') okCount++; });
    state.grid.forEach(function (v) { if (v >= 0) filled++; });
    return { bad: bad, errors: errors, items: items, okCount: okCount, filled: filled };
  }
  function gridCorrect() { var sol = state.puz.solution; return state.grid.every(function (v, i) { return v === sol[i]; }); }

  /* ---------- Rendu ---------- */
  function fiche(s, extra) {
    return '<figure class="fiche s' + s + '"><div class="fiche-img">' + WT.portrait(SUSPECTS[s].name, 'neutre') + '</div>' +
      '<figcaption><span class="fn">' + SUSPECTS[s].short + '</span><small>' + (extra || SUSPECTS[s].role) + '</small></figcaption></figure>';
  }
  function mini(s, ex) { return '<span class="mini s' + s + '">' + WT.portrait(SUSPECTS[s].name, ex || 'neutre') + '</span>'; }

  function renderCase() {
    $('case').innerHTML = '<p class="eyebrow">L’affaire</p><h2>' + LV.caseText.title + '</h2><p>' + LV.caseText.body + '</p>';
    var P = state.puz, h = '<div class="panel-hd"><h2 class="label">Les suspects</h2><span class="sub">' + P.S + ' passagers</span></div><div class="fiches">';
    for (var s = 0; s < P.S; s++) h += fiche(s);
    $('suspects').innerHTML = h + '</div>';
  }

  function renderMap() {
    var P = state.puz, T = P.T, t = state.selT, s, i, chips = '';
    for (i = 0; i < T; i++) chips += '<button type="button" class="chip' + (i === P.crime.t ? ' crime' : '') + '" data-act="time" data-t="' + i + '" aria-pressed="' + (i === t) + '">' + tl(i) + '</button>';
    var occ = ROOMS.map(function () { return []; });
    for (s = 0; s < P.S; s++) { var v = g(s, t); if (v >= 0) occ[v].push(s); }
    var names = SUSPECTS.map(function (x) { return x.name; });
    var tok = function (name, cx, floor) { return '<svg x="' + (cx - 18) + '" y="' + (floor - 43) + '" width="36" height="43.2" viewBox="0 0 100 120">' + WT.bust(name, 'neutre') + '</svg>'; };
    var svg = LC.train({ tok: tok, occ: occ, crime: P.crime.room, labels: LABELS, names: names, culprit: state.solved && t === P.crime.t ? P.culprit : -1, label: 'L’Express en coupe à ' + tl(t) });
    $('map-panel').innerHTML = '<div class="panel-hd"><h2 class="label">L’Express en coupe</h2><span class="sub">à ' + tl(t) + '</span></div>' +
      '<div class="chips" style="--n:' + T + '">' + chips + '</div><div class="train-frame">' + svg + '</div>' +
      '<p class="legend"><span><i class="lg-door"></i>soufflet entre voitures</span><span><i class="lg-ladder"></i>trappe vers le toit</span><span><i class="lg-crime"></i>lieu du vol</span></p>';
  }

  function renderBoard() {
    var P = state.puz, S = P.S, T = P.T, A = analyse(), show = showMarks(), s, t, h = '';
    h += '<div class="panel-hd"><h2 class="label">Chronologie</h2><span class="sub">touche une case</span></div>';
    h += '<div class="board" style="--cols:' + S + '"><div></div>';
    for (s = 0; s < S; s++) h += '<div class="who s' + s + '">' + mini(s) + '<b>' + SUSPECTS[s].short + '</b><small>' + SUSPECTS[s].role + '</small></div>';
    for (t = 0; t < T; t++) {
      h += '<button type="button" class="time' + (t === state.selT ? ' sel' : '') + '" data-act="time" data-t="' + t + '">' + tl(t) + (t === P.crime.t ? '<small>' + LV.crimeNoun + '</small>' : '') + '</button>';
      for (s = 0; s < S; s++) {
        var idx = s * T + t, v = state.grid[idx], given = state.given[idx];
        var cls = 'cell s' + s + (v < 0 ? ' empty' : '') + (given ? ' given' : '') + (show && !given && A.bad[idx] ? ' bad' : '');
        var label = SUSPECTS[s].name + ', ' + tl(t) + ' : ' + (v < 0 ? 'vide' : ROOMS[v].name) + (given ? ' (confirmé)' : '');
        h += '<button type="button" class="' + cls + '" data-act="cell" data-s="' + s + '" data-t="' + t + '" aria-label="' + label + '"' +
          (given || state.solved ? ' disabled' : '') + '>' + (v < 0 ? '' : ROOMS[v].short) + (given ? ICON.lock : '') + '</button>';
      }
    }
    h += '</div>';
    h += '<div class="status"><span>' + A.filled + '/' + (S * T) + ' cases</span>' +
      (show ? '<span class="' + (A.errors ? 'err' : '') + '">' + A.errors + ' contradiction' + (A.errors > 1 ? 's' : '') + '</span>' : '<span>vérification en direct désactivée</span>') +
      (state.wrong && !state.solved ? '<span class="err">' + state.wrong + ' fausse' + (state.wrong > 1 ? 's' : '') + ' accusation' + (state.wrong > 1 ? 's' : '') + '</span>' : '') + '</div>';
    if (state.lastWrong >= 0 && !state.solved) {
      var w = SUSPECTS[state.lastWrong];
      h += '<div class="reply"><span class="mini-wrap">' + mini(state.lastWrong, 'serieux') + '</span><p class="bubble small tail-l">' + esc(LV.wrong[w.name] || 'Vous faites erreur !') + '</p></div>' +
        '<div class="reply r"><p class="bubble small tail-r">Hmm. Son alibi tient. Reprenons la chronologie.</p><span class="mini-wrap"><span class="mini">' + WT.portrait(STORY.detective, 'serieux') + '</span></span></div>';
    }
    if (!state.solved) {
      h += '<div class="actions"><label class="switch"><input type="checkbox" id="live"' + (state.live ? ' checked' : '') + '><span>Vérification en direct</span></label>' +
        '<div class="btns">' + (state.live ? '' : '<button type="button" class="btn sm" data-act="check" title="Contrôle toute la grille d’un coup">Vérifier</button>') +
        '<button type="button" class="btn sm" data-act="hint">Indice</button><button type="button" class="btn sm" data-act="reset">Effacer</button>' +
        '<button type="button" class="btn sm accuse" data-act="accuse">J’accuse !</button></div></div>' +
        '<p class="hintline">' + (state.live ? 'Vérification en direct : les erreurs s’affichent tout de suite en rouge.' : 'Vérification manuelle : rien ne s’affiche tant que tu n’appuies pas sur « Vérifier ».') + '</p>';
    }
    $('board-panel').innerHTML = h;
  }

  function renderClues() {
    var A = analyse(), show = showMarks();
    var h = '<div class="panel-hd"><h2 class="label">Carnet d’Hortense</h2><span class="sub">' + (show ? A.okCount + '/' + A.items.length + ' confirmés' : A.items.length + ' constats') + '</span></div>';
    h += '<label class="switch opts"><input type="checkbox" id="hideok"' + (state.hideOk ? ' checked' : '') + '><span>Masquer les constats confirmés</span></label>';
    var rows = A.items.map(function (it) {
      var st = show ? it.st : 'pending';
      if (state.hideOk && st === 'ok') return '';
      return '<li class="clue ' + st + (it.c.type === 'crime' ? ' rule' : '') + '"><span class="ico">' + ICON[st] + '</span><span class="txt">' + clueText(it.c) + '</span></li>';
    }).join('');
    h += rows ? '<ul class="clues">' + rows + '</ul>' : '<p class="empty-note">Tous les constats sont confirmés.</p>';
    $('clues-panel').innerHTML = h;
  }

  function renderVerdict() {
    var P = state.puz, el = $('verdict');
    if (!state.solved) { el.innerHTML = ''; return; }
    var c = SUSPECTS[P.culprit];
    el.innerHTML = '<div class="panel verdict"><div class="v-top">' + fiche(P.culprit, '<b class="guilty">coupable</b>') + '<div class="stamp">Affaire classée</div></div>' +
      '<p><b>' + c.name + '</b> était ' + (c.f ? 'seule' : 'seul') + ' ' + inRoom(P.crime.room) + ' à ' + tl(P.crime.t) + '. Tous les autres alibis tiennent.</p>' +
      '<p class="sub">' + (state.early ? 'Accusation exacte alors que ' + state.early + ' case' + (state.early > 1 ? 's' : '') + ' restaient à remplir. ' : '') +
      (state.hints ? state.hints + ' indice' + (state.hints > 1 ? 's' : '') + ' utilisé' + (state.hints > 1 ? 's' : '') + '. ' : 'Aucun indice utilisé. ') +
      (state.wrong ? state.wrong + ' fausse' + (state.wrong > 1 ? 's' : '') + ' accusation' + (state.wrong > 1 ? 's' : '') + '.' : 'Aucune fausse accusation.') + '</p>' +
      '<div class="strip epi">' + LV.epilogue.map(beat).join('') + '</div>' +
      '<p class="next"><button type="button" class="btn" data-act="replay">Rejouer ce niveau</button> <span class="soon">Niveau 2 : bientôt</span></p></div>';
  }

  function renderSheet() {
    var root = $('sheet-root'), p = state.picker, P = state.puz;
    if (state.accuse) {
      var ab = '';
      for (var q = 0; q < P.S; q++) {
        var out = state.accused.indexOf(q) >= 0;
        ab += '<button type="button" class="acc-btn' + (out ? ' out' : '') + '" data-act="accpick" data-s="' + q + '"' + (out ? ' disabled' : '') + '>' + fiche(q, out ? 'innocent' : '') + '</button>';
      }
      root.innerHTML = '<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Désigner le coupable">' +
        '<div class="sheet-hd"><b class="acc-t">J’accuse…</b></div><p class="trail">Qui a volé le collier ? Une mauvaise réponse est comptée comme une erreur.</p>' +
        '<div class="acc-grid" style="--n:' + P.S + '">' + ab + '</div><div class="sheet-ft"><button type="button" class="btn sm" data-act="close">Annuler</button></div></div>';
      var f0 = root.querySelector('.acc-btn:not(:disabled)'); if (f0) f0.focus();
      return;
    }
    if (!p) { root.innerHTML = ''; return; }
    var T = P.T, s = p.s, t = p.t, cur = g(s, t);
    var prev = t > 0 ? g(s, t - 1) : -1, next = t < T - 1 ? g(s, t + 1) : -1, trail = [];
    if (t > 0) trail.push(tl(t - 1) + ' ' + (prev >= 0 ? ROOMS[prev].name : '?'));
    trail.push('<b>' + tl(t) + ' ?</b>');
    if (t < T - 1) trail.push(tl(t + 1) + ' ' + (next >= 0 ? ROOMS[next].name : '?'));
    var btns = ROOMS.map(function (room, r) {
      var far = (prev >= 0 && !((STEP[prev] >> r) & 1)) || (next >= 0 && !((STEP[r] >> next) & 1));
      return '<button type="button" class="room-btn' + (r === cur ? ' cur' : '') + (far ? ' far' : '') + '" data-act="pick" data-r="' + r + '">' + room.name + (far ? '<small>trop loin</small>' : '') + '</button>';
    }).join('');
    root.innerHTML = '<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Choisir une voiture">' +
      '<div class="sheet-hd">' + mini(s) + '<b>' + SUSPECTS[s].name + '</b></div><p class="trail">' + trail.join(' → ') + '</p>' +
      '<div class="room-grid">' + btns + '</div><div class="sheet-ft"><button type="button" class="btn sm" data-act="clear">Effacer la case</button><button type="button" class="btn sm" data-act="close">Fermer</button></div></div>';
    var first = root.querySelector('.room-btn.cur') || root.querySelector('.room-btn');
    if (first) first.focus();
  }

  var RULES = [
    'Chaque case de la <b>chronologie</b> indique la voiture où se trouvait un passager à une heure donnée. Touche une case pour la choisir.',
    'Entre deux heures, on <b>reste sur place</b> ou on passe dans une <b>voiture voisine</b> (par le soufflet). Le toit ne se rejoint que par les trappes du wagon-lit B et de la voiture-bar.',
    'Tous les constats du <b>carnet</b> sont vrais, et une seule chronologie les respecte tous.',
    'À l’heure du vol, le voleur était <b>seul</b> dans la voiture du vol. Les cases dorées sont des faits déjà établis.',
    'Pas besoin de tout remplir : dès que tu es sûr, touche <b>J’accuse !</b>. Une mauvaise accusation est comptée comme une erreur.',
    '<b>Vérification en direct</b> : cochée, les erreurs apparaissent aussitôt en rouge. Décochée, le bouton <b>Vérifier</b> contrôle la grille à la demande.'
  ];

  function renderAll() { renderCase(); renderMap(); renderBoard(); renderVerdict(); renderClues(); renderSheet(); }

  function load() {
    var P = JSON.parse(JSON.stringify(LV.puz));
    state.puz = P; state.grid = []; state.given = [];
    for (var i = 0; i < P.S * P.T; i++) { state.grid.push(-1); state.given.push(false); }
    P.clues.forEach(function (c) { if (c.type === 'at') { state.grid[c.s * P.T + c.t] = c.r; state.given[c.s * P.T + c.t] = true; } });
    state.selT = 0; state.checked = false; state.hints = 0; state.solved = false; state.accuse = false; state.accused = []; state.wrong = 0; state.early = 0; state.lastWrong = -1; state.picker = null;
    renderAll();
  }

  function afterChange() {
    state.checked = false;
    if (!state.solved && gridCorrect()) win(0);
    renderMap(); renderBoard(); renderVerdict(); renderClues();
  }
  function win(early) {
    state.solved = true; state.early = early; state.selT = state.puz.crime.t; state.lastWrong = -1;
    lsSet('alibi.histoire.n1', 'ok');
  }
  function setCell(s, t, v) {
    var idx = s * state.puz.T + t;
    if (state.given[idx] || state.solved) return;
    state.grid[idx] = v; afterChange();
  }
  function closeSheet() {
    var p = state.picker;
    state.picker = null; state.accuse = false; renderSheet();
    if (p) { var el = document.querySelector('.cell[data-s="' + p.s + '"][data-t="' + p.t + '"]'); if (el && !el.disabled) el.focus(); }
  }
  function hint() {
    var P = state.puz, wrong = [];
    state.grid.forEach(function (v, i) { if (v !== P.solution[i]) wrong.push(i); });
    if (!wrong.length) return;
    var i = wrong[Math.floor(Math.random() * wrong.length)];
    state.grid[i] = P.solution[i]; state.given[i] = true; state.hints++; state.selT = i % P.T;
    afterChange();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || !state.puz) return;
    switch (el.getAttribute('data-act')) {
      case 'time': state.selT = +el.getAttribute('data-t'); renderMap(); renderBoard(); break;
      case 'cell':
        if (el.disabled) break;
        state.picker = { s: +el.getAttribute('data-s'), t: +el.getAttribute('data-t') };
        state.selT = state.picker.t; renderMap(); renderBoard(); renderSheet(); break;
      case 'pick': if (state.picker) { var p = state.picker; setCell(p.s, p.t, +el.getAttribute('data-r')); closeSheet(); } break;
      case 'clear': if (state.picker) { var q = state.picker; setCell(q.s, q.t, -1); closeSheet(); } break;
      case 'close': closeSheet(); break;
      case 'check': state.checked = true; renderBoard(); renderClues(); break;
      case 'hint': hint(); break;
      case 'reset': state.grid = state.grid.map(function (v, i) { return state.given[i] ? v : -1; }); state.lastWrong = -1; afterChange(); break;
      case 'accuse': if (!state.solved) { state.accuse = true; renderSheet(); } break;
      case 'accpick':
        var as = +el.getAttribute('data-s'), P2 = state.puz;
        state.accuse = false;
        if (as === P2.culprit) {
          var emp = 0;
          state.grid.forEach(function (v, i) { if (v !== P2.solution[i]) emp++; });
          state.grid = P2.solution.slice(); win(emp);
        } else { state.wrong++; state.accused.push(as); state.lastWrong = as; }
        renderSheet(); renderMap(); renderBoard(); renderVerdict(); renderClues();
        if (state.solved) { var vd = $('verdict'); if (vd && vd.scrollIntoView) vd.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        break;
      case 'replay': load(); window.scrollTo(0, 0); break;
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'live') { state.live = e.target.checked; state.checked = false; renderBoard(); renderClues(); }
    if (e.target.id === 'hideok') { state.hideOk = e.target.checked; renderClues(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (state.picker || state.accuse)) closeSheet(); });

  $('rules-list').innerHTML = RULES.map(function (r) { return '<li>' + r + '</li>'; }).join('');
  renderIntro();
  load();
  window.AlibisHistoire = { state: state, load: load };
})();

</script>
